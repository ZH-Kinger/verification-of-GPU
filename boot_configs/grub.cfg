set default=0
set timeout=15

loadfont unicode

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

set driver_block="modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nouveau nouveau.modeset=0"

menuentry "GPU Acceptance - fieldiag mode, persistent, NVIDIA driver blocked" {
	set gfxpayload=keep
	linux	/casper/vmlinuz persistent ${driver_block} ---
	initrd	/casper/initrd
}

menuentry "GPU Acceptance - dcgm mode, persistent, NVIDIA driver allowed" {
	set gfxpayload=keep
	linux	/casper/vmlinuz persistent ---
	initrd	/casper/initrd
}

menuentry "GPU Acceptance - HWE fieldiag mode, persistent, NVIDIA driver blocked" {
	set gfxpayload=keep
	linux	/casper/hwe-vmlinuz persistent ${driver_block} ---
	initrd	/casper/hwe-initrd
}

menuentry "GPU Acceptance - HWE dcgm mode, persistent, NVIDIA driver allowed" {
	set gfxpayload=keep
	linux	/casper/hwe-vmlinuz persistent ---
	initrd	/casper/hwe-initrd
}

menuentry "Try or Install Ubuntu Server - original" {
	set gfxpayload=keep
	linux	/casper/vmlinuz ---
	initrd	/casper/initrd
}

menuentry "Ubuntu Server with the HWE kernel - original" {
	set gfxpayload=keep
	linux	/casper/hwe-vmlinuz ---
	initrd	/casper/hwe-initrd
}

grub_platform
if [ "$grub_platform" = "efi" ]; then
menuentry 'Boot from next volume' {
	exit 1
}
menuentry 'UEFI Firmware Settings' {
	fwsetup
}
else
menuentry 'Test memory' {
	linux16 /boot/memtest86+x64.bin
}
fi

